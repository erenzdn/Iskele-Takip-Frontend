<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' blob: 'unsafe-inline' 'unsafe-eval' http://localhost:* ws://localhost:* https://iskeletakip.mehmeterenozden.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' http://localhost:* https://iskeletakip.mehmeterenozden.com; style-src 'self' 'unsafe-inline' http://localhost:*; connect-src 'self' blob: http://localhost:* ws://localhost:* https://iskeletakip.mehmeterenozden.com; img-src 'self' data: blob: image: http://localhost:* https://iskeletakip.mehmeterenozden.com; frame-src 'self' blob:; object-src 'self' blob:;" />
    <title>İskeleTakip Desktop</title>
    <script>
      (function () {
        var THEME_KEY = 'ui_theme';
        var defaultTheme = 'dark';
        try {
          var storedTheme = localStorage.getItem(THEME_KEY);
          var nextTheme = storedTheme === 'light' || storedTheme === 'dark' ? storedTheme : defaultTheme;
          document.documentElement.setAttribute('data-theme', nextTheme);
        } catch (_error) {
          document.documentElement.setAttribute('data-theme', defaultTheme);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
